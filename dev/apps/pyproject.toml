[project]
name = "skills-apps"
version = "0.1.0"
description = "Apps for the skills repository (e.g. multi-agent generator/evaluator Streamlit loop)"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.28.0",
]

[project.scripts]
multi-agent-generator-evaluator-loop = "multi_agent_generator_evaluator_loop.__main__:main"
weather-forecast = "weather_forecast.__main__:main"

[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["multi_agent_generator_evaluator_loop", "weather_forecast"]
