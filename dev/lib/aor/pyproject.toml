[project]
name = "aor"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.1.8",
    "langchain-core>=1.3.0,<2",
    "dspy>=3.1.3",
    "pydantic>=2.0.0,<3",
    "httpx>=0.28.1,<1.0.0",
    "jsonschema>=4.0.0,<5.0.0",
    "pathspec>=0.12.0,<1.0.0",
    "wcmatch>=10.0,<11.0",
    "typing-extensions>=4.15.0",
    "python-dotenv>=1.2.2",
    "arize-phoenix>=17.8.1",
    "openinference-instrumentation-langchain>=0.1.66",
    "opentelemetry-sdk>=1.42.1",
    "opentelemetry-exporter-otlp>=1.42.1",
    "yfinance>=1.4.1",
]

[project.scripts]
check_aor = "agent._check:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent", "orchestrator"]

[dependency-groups]
dev = [
    "pyright>=1.1.410",
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.17",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]   # pycodestyle errors, pyflakes, isort
ignore = ["E501"]           # line length handled by formatter

[tool.pyright]
pythonVersion = "3.11"
include = ["agent", "orchestrator", "packs"]
reportMissingImports = "warning"
reportMissingModuleSource = "none"

